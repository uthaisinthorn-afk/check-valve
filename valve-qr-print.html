<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พิมพ์ QR Code — ห้องชาร์ปวาล์วน้ำ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --navy:#0e2a3d; --teal:#0f7a72; --line:#dcd8cd; --muted:#6b7178; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun',sans-serif;background:#eee;color:#111;}

  .toolbar{
    position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;
    padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .toolbar input[type=text]{flex:1;min-width:220px;padding:9px 12px;border-radius:8px;border:none;font-family:inherit;font-size:13.5px;}
  .toolbar select{padding:9px 10px;border-radius:8px;border:none;font-family:inherit;font-size:13.5px;}
  .toolbar button{
    background:var(--teal);color:#fff;border:none;border-radius:8px;padding:10px 18px;
    font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .toolbar .hint{font-size:11.5px;opacity:.8;width:100%;}

  .page{
    background:#fff;width:210mm;min-height:297mm;margin:16px auto;padding:8mm;
    display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:min-content;gap:2mm;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    page-break-after:always;
  }
  .cell{
    border:1px dashed #bbb;border-radius:2mm;padding:1.5mm;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    overflow:hidden;
  }
  .cell .qrbox{width:24mm;height:24mm;display:flex;align-items:center;justify-content:center;}
  .cell .qrbox img, .cell .qrbox canvas, .cell .qrbox table{width:24mm !important;height:24mm !important;}
  .cell .code{font-weight:700;font-size:10px;margin-top:1mm;color:var(--navy);}
  .cell .name{font-size:7px;color:var(--muted);line-height:1.15;margin-top:0.5mm;}
  .cell .err{font-size:7.5px;color:#b00;padding:4mm 1mm;}

  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .page{margin:0;box-shadow:none;width:auto;min-height:auto;}
    @page{ size:A4; margin:8mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <input type="text" id="baseUrlInput" placeholder="วาง URL เว็บที่ deploy แล้ว เช่น https://username.github.io/valve-app/valve-checklist.html">
  <select id="floorFilter"><option value="">ทุกชั้น (พิมพ์ทั้งหมด)</option></select>
  <button id="genBtn">🔄 สร้าง QR</button>
  <button id="printBtn">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
  <div class="hint">ใส่ URL ของหน้า valve-checklist.html ที่อัปโหลดขึ้นเว็บจริงแล้วก่อนกด "สร้าง QR" — ไม่งั้น QR จะสแกนไม่ได้ · A4 1 แผ่น = 40 QR</div>
</div>

<div id="pagesWrap"></div>

const PER_PAGE = 50;

function populateFloorFilter(){
  const floors = [...new Set(ROOMS.map(r=>r.floor))];
  const sel = document.getElementById("floorFilter");
  floors.forEach(f=>{
    const o = document.createElement("option");
    o.value = f; o.textContent = "ชั้น " + f;
    sel.appendChild(o);
  });
}
populateFloorFilter();

// จำ URL ที่กรอกไว้ล่าสุดในเครื่องนี้ เผื่อกลับมาพิมพ์เพิ่มทีหลัง
const savedBase = localStorage.getItem("valve_qr_base_url");
if (savedBase) document.getElementById("baseUrlInput").value = savedBase;

function generate(){
  if (typeof QRCode === "undefined"){
    alert("โหลดไลบรารีสร้าง QR ไม่สำเร็จ (อาจเป็นเพราะไม่มีอินเทอร์เน็ต หรือเปิดไฟล์จากเครื่องโดยตรงแทนที่จะเปิดจากเว็บที่ deploy แล้ว) กรุณาเช็คการเชื่อมต่ออินเทอร์เน็ต แล้วลองรีเฟรชหน้านี้ใหม่");
    return;
  }
  const baseUrl = document.getElementById("baseUrlInput").value.trim();
  if (!baseUrl){
    alert("กรุณาใส่ URL ของหน้าแอป (index.html) ก่อน ไม่งั้น QR ที่พิมพ์ออกมาจะสแกนแล้วเปิดไม่ถูกที่");
    return;
  }
  localStorage.setItem("valve_qr_base_url", baseUrl);
  const floor = document.getElementById("floorFilter").value;
  let list = ROOMS;
  if (floor) list = list.filter(r=>r.floor===floor);

  const wrap = document.getElementById("pagesWrap");
  wrap.innerHTML = "";
  let okCount = 0, errCount = 0;
  const pageCount = Math.ceil(list.length / PER_PAGE);
  for (let p = 0; p < pageCount; p++){
    const pageEl = document.createElement("div");
    pageEl.className = "page";
    wrap.appendChild(pageEl);
    const chunk = list.slice(p*PER_PAGE, (p+1)*PER_PAGE);
    for (const room of chunk){
      const cell = document.createElement("div");
      cell.className = "cell";
      pageEl.appendChild(cell);

      const qrBox = document.createElement("div");
      qrBox.className = "qrbox";
      cell.appendChild(qrBox);

      const codeDiv = document.createElement("div");
      codeDiv.className = "code";
      codeDiv.textContent = room.code;
      cell.appendChild(codeDiv);

      const nameDiv = document.createElement("div");
      nameDiv.className = "name";
      nameDiv.textContent = "ชั้น " + room.floor;
      cell.appendChild(nameDiv);

      const url = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "room=" + room.id;
      try{
        // qrcodejs (davidshimjs) — สร้างแบบ sync ทันที ไม่ต้องรอ promise/callback
        // จึงไม่มีปัญหาหลุด loop กลางทางเหมือนไลบรารีแบบ async
        new QRCode(qrBox, { text: url, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });
        okCount++;
      }catch(err){
        qrBox.innerHTML = `<div class="err">สร้าง QR ไม่สำเร็จ<br>${room.code}</div>`;
        errCount++;
        console.error("QR error for room", room.id, err);
      }
    }
  }
  console.log(`สร้าง QR สำเร็จ ${okCount} รายการ, ผิดพลาด ${errCount} รายการ`);
  if (errCount > 0){
    alert(`สร้าง QR ได้ ${okCount} รายการ แต่มี ${errCount} รายการที่ผิดพลาด (ดูรายละเอียดใน Console)`);
  }
}

document.getElementById("genBtn").addEventListener("click", generate);
document.getElementById("printBtn").addEventListener("click", ()=>window.print());

// สร้างอัตโนมัติครั้งแรกถ้ามี URL บันทึกไว้แล้ว
if (savedBase) generate();
</script>
